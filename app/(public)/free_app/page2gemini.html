<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTSS Million Bucks Makeover Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Adding a punchy font to match the poster's energy */
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body
    class="min-h-screen bg-gray-950 flex items-center justify-center p-4 text-gray-100"
  >
    <div
      class="max-w-2xl w-full bg-gray-900 border border-cyan-500/30 rounded-2xl p-8 md:p-12 shadow-[0_0_40px_rgba(6,182,212,0.15)] relative overflow-hidden"
    >
      <div
        class="absolute top-0 left-1/2 -translate-x-1/2 w-3/4 h-32 bg-cyan-500/20 blur-[100px] pointer-events-none"
      ></div>

      <div class="text-center mb-10 relative z-10">
        <h2
          class="text-3xl md:text-5xl font-black text-white tracking-tight uppercase italic mb-2"
        >
          Claim Your <span class="text-cyan-400">Free</span> Makeover
        </h2>
        <p class="text-gray-400 text-lg">
          Only <span class="text-red-500 font-bold">10 slots</span> available.
          Ditch the "DM for price" hustle. Let's scale.
        </p>
      </div>

      <form action="#" method="POST" class="space-y-6 relative z-10">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2">
            <label
              for="name"
              class="text-sm font-bold text-gray-300 uppercase tracking-wider"
              >Your Name <span class="text-cyan-500">*</span></label
            >
            <input
              type="text"
              id="name"
              name="name"
              required
              placeholder="The Boss"
              class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-colors"
            />
          </div>

          <div class="space-y-2">
            <label
              for="businessName"
              class="text-sm font-bold text-gray-300 uppercase tracking-wider"
              >Business Name <span class="text-cyan-500">*</span></label
            >
            <input
              type="text"
              id="businessName"
              name="businessName"
              required
              placeholder="The Brand"
              class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-colors"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2">
            <label
              for="phone"
              class="text-sm font-bold text-gray-300 uppercase tracking-wider"
              >WhatsApp Number <span class="text-cyan-500">*</span></label
            >
            <input
              type="tel"
              id="phone"
              name="phone"
              required
              placeholder="+254 XXX XXX XXX"
              class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-colors"
            />
          </div>

          <div class="space-y-2">
            <label
              for="category"
              class="text-sm font-bold text-gray-300 uppercase tracking-wider"
              >Your Hustle <span class="text-cyan-500">*</span></label
            >
            <select
              id="category"
              name="category"
              required
              class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-3 text-gray-300 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-colors appearance-none cursor-pointer"
            >
              <option value="" disabled selected>
                Select your category...
              </option>
              <option value="campus">🎓 The Campus Hustler</option>
              <option value="food">🍔 The Local Food Joint</option>
              <option value="service">✂️ The Service Plug</option>
              <option value="boutique">👗 The Boutique Owner</option>
              <option value="other">🚀 Something Else</option>
            </select>
          </div>
        </div>

        <div class="space-y-2">
          <label
            for="pitch"
            class="text-sm font-bold text-gray-300 uppercase tracking-wider flex justify-between"
          >
            <span>The Pitch <span class="text-cyan-500">*</span></span>
            <span class="text-xs text-gray-500 normal-case font-normal"
              >Make it interesting.</span
            >
          </label>
          <textarea
            id="pitch"
            name="pitch"
            required
            rows="4"
            placeholder="What do you do, and why do you deserve one of the 10 spots?"
            class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-colors resize-none"
          ></textarea>
        </div>

        <button
          type="submit"
          class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-black text-xl italic uppercase py-4 rounded-lg shadow-[0_0_20px_rgba(6,182,212,0.4)] hover:scale-[1.02] active:scale-[0.98] transition-all duration-300 mt-4 flex items-center justify-center gap-2 cursor-pointer"
        >
          I WANT IN <span class="text-2xl">🚀</span>
        </button>

        <p
          class="text-center text-xs text-red-500 font-bold uppercase mt-4 tracking-widest"
        >
          Once the slots are gone, they are gone.
        </p>
      </form>
    </div>
  </body>
</html>
